[project]
name = "ggsn-projektowe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    # PyTorch 2.2.x (Intel mac) — wheel vs NumPy 2.x → import torch się sypie.
    "numpy>=1.26.4,<2",
    "pandas>=2.2.2,<3",
    "polars[rtcompat]>=1.39.3",
    "scikit-learn>=1.8.0",
    # Intel mac: brak wheeli torch≥2.3 na PyPI (tylko arm64). Ostatnia linia 2.2.x.
    "torch>=2.2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.6,<2.7; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # transformers 5.5+ wymaga torch≥2.4; na Intel mac mamy torch 2.2.x.
    "torch-geometric>=2.7.0",
    "transformers>=4.46,<5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers>=5.5.4; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
# Manim wymaga numpy≥2.1 (koliduje z torch 2.2 + numpy<2 na Intel Mac) — animacje: osobne venv.
viz = [
    "umap-learn>=0.5.12",
]

# Intel Mac: torch 2.2 + numpy<2 + transformers 4.x (HF wymaga torch≥2.4 od v5).
# Reszta platform: torch 2.6 + numpy 1.x/2.x + transformers 5.x.
# Animacje UMAP: `uv sync --extra viz`. Manim — osobno (numpy 2 vs Intel Mac).
# GPU Linux: dodatkowo https://pytorch.org/get-started/locally/
